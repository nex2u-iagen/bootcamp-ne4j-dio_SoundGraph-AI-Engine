[project]
name = "neo4j-music-recommender"
version = "0.1.0"
description = "Motor de recomendação musical baseado em grafos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "neo4j>=5.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "SIM", "UP"]
